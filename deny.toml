# Política de dependencias (cargo-deny). Se ejecuta en CI y bloquea el merge.

[graph]
all-features = false
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]

[advisories]
version = 2
yanked = "deny"
# Solo se exige mantenimiento a las dependencias directas; las transitivas
# (egui, wgpu, zbus) se revisan al actualizar eframe.
unmaintained = "workspace"
ignore = [
    # quick-xml 0.30 solo llega vía accesskit_unix → atspi-common → zbus-lockstep
    # (Linux), que analiza las definiciones XML de D-Bus incluidas en el propio
    # crate, nunca datos del usuario. Se elimina al actualizar eframe (fase 1).
    # El lector .ora de Pyrotecnika debe usar quick-xml >= 0.41.
    { id = "RUSTSEC-2026-0194", reason = "transitiva vía zbus-lockstep; solo XML embebido" },
    { id = "RUSTSEC-2026-0195", reason = "transitiva vía zbus-lockstep; solo XML embebido" },
]

[licenses]
version = 2
# Compatibles con distribuir Pyrotecnika bajo MIT OR Apache-2.0.
# Sin GPL/AGPL/LGPL.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
