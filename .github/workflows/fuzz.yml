name: Fuzzing

# Cada noche, y a mano desde Actions. Necesita nightly y Linux (libFuzzer).
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  fuzz:
    name: Fuzzing (${{ matrix.target }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target: [open_bytes, inspect_png]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - name: Diez minutos de entradas al azar
        working-directory: fuzz
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=600 -rss_limit_mb=6144
      - name: Guardar el archivo que lo hizo caer
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts
