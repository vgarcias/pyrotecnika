name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: Formato, clippy y reglas de arquitectura
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Dependencias de sistema (Linux)
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: El núcleo y los formatos no dependen de la interfaz
        run: |
          for crate in pyro-core pyro-formats; do
            if cargo tree -p "$crate" -e normal | grep -E "egui|eframe|winit"; then
              echo "::error::$crate no puede depender de la interfaz"; exit 1
            fi
          done
      - name: El código específico de SO solo vive en pyro-platform
        run: |
          if grep -rn --include='*.rs' 'cfg(.*target_os' crates app | grep -v '^crates/pyro-platform/'; then
            echo "::error::Mueve el código específico de SO a crates/pyro-platform"; exit 1
          fi
      - name: Sin colores literales fuera del sistema de diseño
        run: |
          if grep -rnE 'Color32::(from_|[A-Z]{3,})' --include='*.rs' crates app \
             | grep -v '^crates/pyro-ui/src/design/' \
             | grep -vE 'Color32::(WHITE|TRANSPARENT)\b'; then
            echo "::error::Usa los tokens de crates/pyro-ui/src/design"; exit 1
          fi

  deny:
    name: Licencias y avisos de seguridad
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  test:
    name: Pruebas (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Dependencias de sistema (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets
      - run: cargo build --release -p pyrotecnika
      - uses: actions/upload-artifact@v4
        with:
          name: pyrotecnika-${{ runner.os }}
          path: |
            target/release/pyrotecnika
            target/release/pyrotecnika.exe
          if-no-files-found: error
          retention-days: 7

  macos-open-files:
    name: Prueba de concepto — abrir archivos desde el Finder
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bash packaging/macos/poc-open-files.sh
