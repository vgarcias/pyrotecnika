[workspace]
resolver = "2"
members = ["crates/*", "app/pyrotecnika"]
exclude = ["fuzz"]
default-members = ["app/pyrotecnika"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
publish = false

[workspace.dependencies]
pyro-core = { path = "crates/pyro-core" }
pyro-formats = { path = "crates/pyro-formats" }
pyro-platform = { path = "crates/pyro-platform" }
pyro-services = { path = "crates/pyro-services" }
pyro-ui = { path = "crates/pyro-ui" }

anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
png = "0.17"
color_quant = "1.1"
webp = { version = "0.3", default-features = false }
rfd = "0.15"
# Backend wgpu: Metal en macOS, DX12/Vulkan en Windows, Vulkan/GL en Linux.
eframe = { version = "0.31", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "wayland", "x11"] }
crc32fast = "1"
rayon = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"

# Compila las dependencias optimizadas incluso en modo debug: la edición
# de píxeles es demasiado lenta sin optimizar.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
